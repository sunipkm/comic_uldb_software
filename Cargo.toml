[workspace]
resolver = "2"
members = [
    "gui",
    "packet",
    "server",
    "ublox-gps"
]

[workspace.dependencies]
packet = { path = "packet" }
generic-camera = { version = ">= 0.0.10" }
bincode = { version = "1.3" }
refimage = { version = ">= 1.0.0-pre" }
ublox-gps-tec = { path = "ublox-gps" }
bno055 = { path = "bno055" }
mcp9808 = { path = "mcp9808-rs" }
datastor = { path = "datastor" }